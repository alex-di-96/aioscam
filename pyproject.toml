[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aioscam"
version = "0.1.8.1"
description = "Async framework for Max messenger bots (aiogram-style)"
readme = "README.md"
license = {text = "PolyForm-Noncommercial-1.0.0"}
authors = [
    {name = "AioScam Contributors"}
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Communications :: Chat",
    "Framework :: AsyncIO",
]
dependencies = [
    "aiohttp>=3.9.0",
    "aiofiles>=23.0.0",
    "magic-filter>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]
litestar = [
    "litestar>=2.0.0",
    "uvicorn>=0.23.0",
]
docs = [
    "sphinx>=7.0",
    "myst-parser>=2.0",
    "furo>=2023.0",
    "sphinx-copybutton>=0.5",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "coverage>=7.0.0",
]
all = [
    "aioscam[fastapi,litestar,dev,docs]",
]

[project.urls]
Homepage = "https://github.com/alex-di-96/aioscam"
Documentation = "https://github.com/alex-di-96/aioscam#readme"
Repository = "https://github.com/alex-di-96/aioscam"
"Bug Tracker" = "https://github.com/alex-di-96/aioscam/issues"

[tool.setuptools.package-data]
aioscam = ["py.typed"]

[tool.setuptools.packages.find]
include = ["aioscam*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py39"
line-length = 120
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
